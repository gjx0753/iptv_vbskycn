name: Sync with Upstream Repository

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: '上游仓库地址'
        required: true
        default: 'vbskycn/iptv'
      upstream_branch:
        description: '上游分支名称'
        required: true
        default: 'master'
  
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    
    # 添加并发控制，防止重复执行
    concurrency:
      group: sync-upstream
      cancel-in-progress: false
    
    # 明确声明权限
    permissions:
      contents: write
    
    steps:
    - name: Checkout current repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        persist-credentials: true  # 确保凭据持久化

    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Add upstream remote
      run: |
        UPSTREAM_REPO="${{ github.event.inputs.upstream_repo || 'vbskycn/iptv' }}"
        if ! git remote | grep -q "^upstream$"; then
          git remote add upstream https://github.com/${UPSTREAM_REPO}.git
        fi
        git fetch upstream

    - name: Check if there are changes to sync
      id: check_changes
      run: |
        UPSTREAM_BRANCH="${{ github.event.inputs.upstream_branch || 'master' }}"
        
        # 检查上游是否有新提交
        LOCAL=$(git rev-parse HEAD)
        UPSTREAM=$(git rev-parse upstream/$UPSTREAM_BRANCH)
        
        if [ "$LOCAL" = "$UPSTREAM" ]; then
          echo "no_changes=true" >> $GITHUB_OUTPUT
          echo "No changes to sync"
        else
          COUNT=$(git rev-list --count HEAD..upstream/$UPSTREAM_BRANCH)
          echo "no_changes=false" >> $GITHUB_OUTPUT
          echo "Found $COUNT new commits to sync"
        fi

    - name: Sync with upstream
      if: steps.check_changes.outputs.no_changes == 'false'
      run: |
        UPSTREAM_BRANCH="${{ github.event.inputs.upstream_branch || 'master' }}"
        CURRENT_BRANCH="master"
        
        git checkout $CURRENT_BRANCH
        
        # 备份工作流文件
        WORKFLOW_BACKUP="/tmp/workflow_backup"
        mkdir -p "$WORKFLOW_BACKUP"
        [ -d ".github/workflows" ] && cp -r .github/workflows "$WORKFLOW_BACKUP/"
        
        # 执行合并
        git fetch upstream $UPSTREAM_BRANCH
        
        if ! git merge upstream/$UPSTREAM_BRANCH --no-edit; then
          echo "检测到合并冲突，尝试自动解决"
          git checkout --theirs .
          git add .
          git commit -m "强制同步：解决合并冲突，使用上游版本" --no-edit || true
        fi
        
        # 恢复工作流文件
        if [ -d "$WORKFLOW_BACKUP/workflows" ]; then
          rm -rf .github/workflows
          cp -r "$WORKFLOW_BACKUP/workflows" .github/workflows
          if ! git diff --quiet -- .github/workflows/; then
            git add .github/workflows/
            git commit -m "chore: 保留本地工作流配置" --no-edit || true
          fi
        fi
        
        # 推送（使用 --force-with-lease 更安全）
        git push origin $CURRENT_BRANCH --force-with-lease

    - name: Create sync summary
      if: always()
      run: |
        if [ "${{ steps.check_changes.outputs.no_changes }}" == "false" ]; then
          echo "## 🔄 同步完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ 已成功同步上游仓库的更改" >> $GITHUB_STEP_SUMMARY
        else
          echo "## ℹ️ 无需同步" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "当前仓库已是最新状态" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**检查时间:** $(date)" >> $GITHUB_STEP_SUMMARY
